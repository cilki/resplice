[workspace]
members = ["resplice-macros", "examples/adder"]
resolver = "2"

[package]
authors = ["cilki"]
description = "Rewrite it in Rust"
edition = "2024"
license = "Unlicense"
name = "resplice"
readme = "README.md"
repository = "https://github.com/cilki/resplice"
rust-version = "1.85"
version = "0.0.3"

[dependencies]
object = "0.40"
goblin = "0.10"
anyhow = "1.0"
clap = { version = "4.6.6", features = ["derive"] }

[dev-dependencies]
object = { version = "0.40", features = ["write"] }
