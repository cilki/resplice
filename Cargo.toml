[workspace]
members = ["resplice-macros", "examples/adder"]
resolver = "2"

[package]
authors = ["cilki"]
description = "Rewrite it in Rust"
edition = "2024"
license = "Unlicense"
name = "resplice"
readme = "README.md"
repository = "https://github.com/cilki/resplice"
rust-version = "1.85"
version = "0.0.3"

[dependencies]
# `default-features = false` drops `object`'s `compression` feature, and with it
# the `flate2`/`ruzstd` decompressors. Nothing here decompresses: the rlib is
# read through `section_by_index` + `data()`, which hands back a section's bytes
# as they sit in the file, and the decompressing calls (`uncompressed_data`,
# `compressed_data().decompress()`, and `section_by_name`'s `.zdebug_*`
# fallback) are never used. Carrying the decompressors anyway means carrying
# their advisories -- `RUSTSEC-2026-0344`, a zstd decompression bomb, is the
# current one -- for code that cannot run.
object = { version = "0.40", default-features = false, features = ["read", "std"] }
goblin = "0.10"
anyhow = "1.0"
clap = { version = "4.6.6", features = ["derive"] }
# The rlib is read for its object members only, and in a crate compiled the
# way `cargo build` compiles one `lib.rmeta` is the bulk of the archive -- 14MB
# of 18MB for a crate of a few thousand splices. Mapping the file instead of
# reading it leaves those pages unfaulted, so the metadata costs nothing in
# either time or resident memory. See `link::map_rlib`.
memmap2 = "0.9.11"

[dev-dependencies]
# Must repeat `default-features = false`: features are unified per package, so
# leaving the defaults on here would pull the decompressors back into the lock
# file (and into every `cargo test` build).
object = { version = "0.40", default-features = false, features = ["read", "std", "write"] }
